[project]
name = "retexo"
version = "0.1.0"
description = "Retexo explains Latin text reuse word by word: it aligns a reusing passage to its source and names the operation behind every link."
authors = [
    {name = "Julian Schelb", email = "julian.schelb@uni-konstanz.de"},
    {name = "Michael Wittweiler", email = "michael.wittweiler@sglp.uzh.ch"},
    {name = "Marie Revellio"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.15"
keywords = ["latin", "intertextuality", "text reuse", "word alignment", "edit scripts", "digital humanities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Latin",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy (>=1.24.0,<3.0.0)",
    "scipy (>=1.10.0,<2.0.0)",
    "pandas (>=2.0.0,<3.0.0)",
    "scikit-learn (>=1.3.0,<2.0.0)",
    "torch (>=2.0.0,<3.0.0)",
    "transformers (>=4.30.0,<5.0.0)",
    "huggingface-hub (>=0.20.0)",
    "locisimiles (>=2.1.3)",
]

[project.urls]
Homepage = "https://julianschelb.github.io/retexo/"
Documentation = "https://julianschelb.github.io/retexo/"
Repository = "https://github.com/julianschelb/retexo"
Demo = "https://julianschelb.github.io/retexo/demo/"
Dataset = "https://huggingface.co/datasets/julian-schelb/latin-classical-intertextuality-edit-scripts"
Changelog = "https://github.com/julianschelb/retexo/blob/main/CHANGELOG.md"
Issues = "https://github.com/julianschelb/retexo/issues"

[project.optional-dependencies]
gui = [
    "gradio (>=5.49.1)",
]
lexical = [
    # The symbolic typer and the lexical evidence look words up in these resources.
    "cltk (>=1.1.0,<2.0.0) ; python_version < '3.13'",
    "spacy (>=3.5.0,<4.0.0)",
    "stanza (>=1.7.0)",
    "nltk (>=3.8.0)",
    "gensim (>=4.3.0,<5.0.0)",
]
llm = [
    "anthropic (>=0.30.0)",
    "peft (>=0.10.0)",
]
plots = [
    "matplotlib (>=3.7.0)",
]
dev = [
    "pytest (>=8.0.0,<10.0.0)",
    "pytest-cov (>=4.0.0)",
    "poethepoet (>=0.24.0)",
    "mkdocs (>=1.5.0)",
    "mkdocs-material (>=9.0.0)",
    "mkdocstrings[python] (>=0.24.0)",
    "ruff (>=0.8.0)",
    "pre-commit (>=3.5.0)",
    "build",
    "twine",
]

[project.scripts]
retexo = "retexo.cli:main"
retexo-gui = "retexo_gui.app:main"

[tool.poetry]
packages = [
    {include = "retexo", from = "src"},
    {include = "retexo_gui", from = "src"},
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
pythonpath = ["src"]

[tool.poe.tasks]
test = "pytest"
test-cov = "pytest --cov=retexo --cov-report=term-missing"
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
format-check = "ruff format --check src/ tests/"
docs = "mkdocs serve"
docs-build = "mkdocs build"
webapp = "npm --prefix webapp run dev"

# ---------- Ruff ----------
# Mirrors the locisimiles package (the formatting template for this repo).

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (formatter handles this)
    "E702",   # multiple-statements-on-one-line (used in test mocks)
    "SIM108", # ternary operator (readability)
    "B905",   # zip strict (py310 compat)
    "UP006",  # non-PEP585 annotation — modernise Dict→dict etc. later
    "UP007",  # X | Y union syntax (needs runtime support)
    "UP035",  # deprecated typing imports — modernise later
    "UP045",  # Optional[X] → X | None — modernise later
]

[tool.ruff.lint.isort]
known-first-party = ["retexo", "retexo_gui"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]              # relax bugbear & simplify in tests
"src/**/__init__.py" = ["F401"]       # re-exports look like unused imports
"src/retexo/resources/*.py" = ["B019"]  # caches on methods are the point: long-lived lookup layers
