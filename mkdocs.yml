site_name: Retexo
site_description: Word-level explanations of text reuse in Latin literature.
site_url: https://julianschelb.github.io/retexo/
repo_url: https://github.com/julianschelb/retexo
repo_name: julianschelb/retexo

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/julianschelb/retexo
  generator: false

copyright: MIT License

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_toc_entry: true
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_bases: false
            show_if_no_docstring: false
            filters: ["!^_"]
            group_by_category: false
            members_order: source
            show_category_heading: false
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 60
            docstring_style: google
            docstring_section_style: spacy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Data Format: data-format.md
  - Labels: labels.md
  - CLI Reference: cli.md
  - Review App: web-demo.md
  - API Reference:
    - Overview: api/index.md
    - Export: api/export.md
    - Paths: api/paths.md
  - Development: development.md
